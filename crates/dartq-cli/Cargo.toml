[package]
name = "dartq-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The dartq command-line tool for fast Dart static analysis (dartq check, dartq analyze)."
repository.workspace = true
readme = "README.md"
keywords = ["dart", "analyzer", "linter", "cli"]
categories = ["development-tools"]

# The published command faces are `dartq check` (M0 differential) and
# `dartq analyze` (M1 engine); ship the binary under the tool name rather
# than the package name.
[[bin]]
name = "dartq"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
mimalloc = { workspace = true }
dartq-commands = { workspace = true }
dartq-daemon = { workspace = true }
dartq-diagnostics = { workspace = true }
dartq-engine = { workspace = true }
# Pub-native plugin discovery (the fix/assists launcher) resolves declared
# plugin packages against the parsed package_config.json.
dartq-pub = { workspace = true }
# The daemon face's dartq.yaml context assembly (#1086) loads each
# declared context's SDK snapshot at the shell edge (the CLI owns SDK
# discovery; the daemon is shell only).
dartq-sdk = { workspace = true }
# The fix apply face's span-capacity gate (#1543 bypass face) speaks the
# source crate's capacity constant and error text directly.
dartq-source = { workspace = true }
# The `dartq test` face's substrate (result cache, grouped runner, host
# memory leases, reporters).
dartq-test = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Test-only: the stale-config advisory tests pin the pub faces' mtime
# chain.
[dev-dependencies]
filetime = { workspace = true }
tempfile = "3"

# The metrics hook reads peak RSS through getrusage;
# unix-only until a non-unix story exists.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
