[package]
name = "dartq-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The dartq command-line tool for fast Dart static analysis (dartq check, dartq analyze)."
repository.workspace = true
readme = "README.md"
keywords = ["dart", "analyzer", "linter", "cli"]
categories = ["development-tools"]

# The published command faces are `dartq check` (M0 differential,
# engine-api-spec §4.1) and `dartq analyze` (M1 engine); ship the binary
# under the tool name rather than the package name.
[[bin]]
name = "dartq"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
dartq-commands = { workspace = true }
dartq-daemon = { workspace = true }
dartq-diagnostics = { workspace = true }
dartq-engine = { workspace = true }
serde_json = { workspace = true }

# Test-only: the main.rs tests build `Diagnostic`s over a `FileTable`, and
# the fix face's write-back tests anchor edits with a `LineIndex`.
[dev-dependencies]
dartq-source = { workspace = true }

# The metrics hook reads peak RSS through getrusage (engine-api-spec §3);
# unix-only until a non-unix story exists.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
