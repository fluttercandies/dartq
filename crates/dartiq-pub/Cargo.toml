[package]
name = "dartiq-pub"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dartiq-language = { path = "../dartiq-language" }
dartiq-source = { path = "../dartiq-source" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
# Directly pinning file mtimes; std cannot set them and the freshness rules
# are stated in terms of strict mtime ordering (equal counts as stale).
filetime = "0.2"

[lints]
workspace = true
