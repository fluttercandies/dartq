[package]
name = "dartq-toolchain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Toolchain binary resolution shared by every dartq face: one precedence (config pin, environment override, PATH scan) for the flutter and dart executables, and the machine-wide run queue test executions join before spawning them."
repository.workspace = true
categories = ["development-tools"]
keywords = ["dart", "flutter", "toolchain"]

# The process-tree budget signals analyzer trees (kill(2) per pid).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The run-queue tests build their ticket directories in self-cleaning
# temporary roots.
[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
