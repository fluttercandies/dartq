[package]
name = "dartq-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The dartq daemon: a resident RPC server over the multi-context analysis runtime — millisecond diagnostics and headless batch queries for AI agents, over JSON-RPC on stdio."
repository.workspace = true
readme = "README.md"
keywords = ["dart", "rpc", "jsonrpc", "daemon"]
categories = ["development-tools"]

[dependencies]
crossbeam-channel = { workspace = true }
dartq-commands = { workspace = true }
# The `dartq/debug/*` faces ride dartq-debug's synchronous VM Service
# client and session orchestration (launch/attach, breakpoints, steps,
# stopped snapshots, bounded event/output rings).
dartq-debug = { workspace = true }
dartq-diagnostics = { workspace = true }
dartq-engine = { workspace = true }
# The `element_at` reverse-query rows (T4) read the engine's maintained
# captures: `DeclRow`/`FileCapture` name the row shapes in the server's
# signatures.
dartq-index = { workspace = true }
dartq-plugin = { workspace = true }
# Pub-native plugin discovery resolves declared plugin packages against the
# parsed package_config.json (lib face: the session's engine config and both
# launcher paths).
dartq-pub = { workspace = true }
# The rename faces' new-name gate rejects the scanner's reserved words: the
# keyword table is the scanner's own classification, not a daemon fork.
dartq-scanner = { workspace = true }
dartq-snapshot = { workspace = true }
dartq-source = { workspace = true }
# The watch face's OS-event substrate (FSEvents on macOS, inotify on
# Linux) behind the WatchSource seam — the poll substrate stays as the
# fallback. Admitted from the local registry cache: MSRV 1.60; the macOS
# face is fsevent-sys (no bindgen build, sole dep libc) + bitflags + log +
# walkdir; crossbeam-channel is a default feature and already a dep here.
notify = "6.1.1"
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The `plugins:` section of the governing analysis options file (T5 rule
# enablement) parses here, root-file-only.
serde_yaml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
dartq-package = { workspace = true }
dartq-sdk = { workspace = true }
# The session-economics answers (query symbols/since) validate against the
# published schema in the overlay-scenario test.
dartq-schema = { workspace = true }

[lints]
workspace = true
