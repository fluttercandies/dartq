[package]
name = "dartq-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The dartq daemon: an LSP shell over the multi-context analysis runtime, speaking JSON-RPC on stdio."
repository.workspace = true
readme = "README.md"
keywords = ["dart", "lsp", "language-server", "daemon"]
categories = ["development-tools"]

[dependencies]
crossbeam-channel = { workspace = true }
dartq-commands = { workspace = true }
dartq-diagnostics = { workspace = true }
dartq-engine = { workspace = true }
dartq-plugin = { workspace = true }
dartq-snapshot = { workspace = true }
dartq-source = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The `plugins:` section of the governing analysis options file (T5 rule
# enablement) parses here, root-file-only.
serde_yaml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
dartq-package = { workspace = true }
dartq-pub = { workspace = true }
dartq-sdk = { workspace = true }
# The session-economics answers (query symbols/since) validate against the
# published schema in the overlay-scenario test.
dartq-schema = { workspace = true }

[lints]
workspace = true
