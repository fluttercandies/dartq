[package]
name = "dartq-scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Dart lexical scanner: UTF-8 source to a linear token table with syntax diagnostics."
repository.workspace = true
readme = "README.md"
keywords = ["dart", "lexer", "scanner", "tokenizer"]
categories = ["parser-implementations"]

[dependencies]
# Frozen contract dependencies (see the "unified swap points" section in lib.rs):
# before #11/#12/#17 land, the scanner internally uses shape-identical local types
# (LanguageVersion / Diagnostic / LineIndex); after they land, only the type
# sources are swapped.
dartq-language = { workspace = true }
dartq-source = { workspace = true }
dartq-diagnostics = { workspace = true }

[lints]
workspace = true
