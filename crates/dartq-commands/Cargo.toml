[package]
name = "dartq-commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Per-command cores shared by the dartq CLI and daemon RPC faces: plain parameters in, typed results out."
repository.workspace = true
readme = "README.md"
keywords = ["dart", "analyzer"]
categories = ["development-tools"]

[dependencies]
dartq-ai = { workspace = true }
dartq-ast = { workspace = true }
dartq-diagnostics = { workspace = true }
dartq-engine = { workspace = true }
dartq-flow = { workspace = true }
dartq-index = { workspace = true }
dartq-language = { workspace = true }
dartq-lints = { workspace = true }
dartq-package = { workspace = true }
dartq-parser = { workspace = true }
dartq-plugin = { workspace = true }
dartq-pub = { workspace = true }
dartq-resolution = { workspace = true }
dartq-scanner = { workspace = true }
dartq-schema = { workspace = true }
dartq-sdk = { workspace = true }
dartq-semantic = { workspace = true }
dartq-source = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Directly pinning file mtimes in the stale-config advisory tests; std
# cannot set them and the freshness rules are stated in strict mtime
# ordering (equal counts as stale).
filetime = { workspace = true }

[lints]
workspace = true
