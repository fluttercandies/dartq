[package]
name = "dartq-commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Per-command cores shared by the dartq CLI and daemon RPC faces: plain parameters in, typed results out."
repository.workspace = true
readme = "README.md"
keywords = ["dart", "analyzer"]
categories = ["development-tools"]

[dependencies]
dartq-ai = { workspace = true }
dartq-ast = { workspace = true }
dartq-diagnostics = { workspace = true }
dartq-engine = { workspace = true }
dartq-flow = { workspace = true }
dartq-index = { workspace = true }
dartq-language = { workspace = true }
dartq-lints = { workspace = true }
dartq-package = { workspace = true }
dartq-parser = { workspace = true }
dartq-plugin = { workspace = true }
dartq-pub = { workspace = true }
dartq-resolution = { workspace = true }
dartq-scanner = { workspace = true }
dartq-schema = { workspace = true }
dartq-sdk = { workspace = true }
dartq-semantic = { workspace = true }
dartq-source = { workspace = true }
# The analyze/check renderers' LON encoder (`render`): the one writer the
# cold CLI and the daemon's routed face share (#2627).
lon = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Directly pinning file mtimes in the stale-config advisory tests; std
# cannot set them and the freshness rules are stated in strict mtime
# ordering (equal counts as stale).
filetime = { workspace = true }
# The example suite (`tests/fix_examples.rs`) enumerates the fix table
# through `fix_table::all_specs`; an integration test builds this crate as
# its own library dependency, where `cfg(test)` is off — this self edge
# turns the `test-support` feature on for that build (the same shape
# dartq-lints' fixture bridge uses).
dartq-commands = { path = ".", features = ["test-support"] }

[features]
# Exposes the fix table's row enumeration (`fix_table::all_specs`) to the
# out-of-crate example suite. Feature-off builds are byte-identical to
# before the feature existed.
test-support = []

[lints]
workspace = true
