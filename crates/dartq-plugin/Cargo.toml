[package]
name = "dartq-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The dartq plugin protocol: IPC contract between the Rust core and per-plugin Dart host processes."
repository.workspace = true
readme = "README.md"
keywords = ["dart", "plugin", "ipc", "protocol"]
categories = ["development-tools"]

[dependencies]
# The engine feed face converts `Diagnostic`s (engine model) onto the wire;
# `FileTable` resolves FileIds to the wire's path strings.
dartq-diagnostics = { workspace = true }
dartq-source = { workspace = true }
# Pub-native discovery resolves declared plugin packages against the parsed
# package_config.json (dartq-pub owns the rootUri resolution rules).
dartq-pub = { workspace = true }
# Process-group kill on Unix: an enforcement kill must take descendants that
# inherited the child's pipes down with the child.
libc = { workspace = true }
memchr = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rustc-hash = { workspace = true }

[lints]
workspace = true
