name: jaspr_compat
description: >-
  Live-compat overlay wiring the real jaspr_lints plugin (vendored snapshot
  under vendor/jaspr_lints, see vendor/PROVENANCE.md) onto the dartq plugin
  host. Not published.
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  # The official registration face the upstream plugin's `register` call
  # expects (the bridge implements it).
  analysis_server_plugin: ^0.3.0
  # The bridge names `DiagnosticCode` (the fix-code identity the host mirror
  # keys on).
  analyzer: ^12.1.0
  dartq_plugin_host:
    path: ../..
  jaspr_lints:
    path: vendor/jaspr_lints
