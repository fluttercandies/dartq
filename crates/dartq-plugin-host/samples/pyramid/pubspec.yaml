name: pyramid_compat
description: >-
  Live-compat overlay wiring the real pyramid_lint plugin (pinned clone under
  .third/aswp-samples/pyramid_lint) onto the dartq plugin host. Not published.
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  # The official registration face the upstream plugin's `register` call
  # expects (the bridge implements it), and `DiagnosticCode` for the fix-code
  # identity the host mirror keys on.
  analysis_server_plugin: ^0.3.15
  analyzer: ^13.0.0
  dartq_plugin_host:
    path: ../..
  pyramid_lint:
    path: ../../../../.third/aswp-samples/pyramid_lint
