name: analysis_server_plugin
description: >-
  Import shim standing in for the official package:analysis_server_plugin on
  the dartq plugin host (PRD section 14). A plugin written verbatim against
  the official API imports this package unchanged; the host launcher maps the
  `analysis_server_plugin` package name here via package_config. Never
  published.
version: 0.4.0
environment:
  sdk: ^3.10.0
dependencies:
  # The rule face (`registerLintRule`/`registerWarningRule`) is typed against
  # the analyzer's `AbstractAnalysisRule` — the same dependency the official
  # package carries. Parse-only usage: the shim never resolves. The range
  # mirrors the host's (see the host pubspec): the sample overlays compile
  # both against analyzer 8.4 / 12.1 / 13.x, and the shim touches only the
  # `AbstractAnalysisRule` + `DiagnosticCode` names shared by all three.
  analyzer: ">=8.4.0 <14.0.0"
