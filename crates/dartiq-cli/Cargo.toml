[package]
name = "dartiq-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The published command faces are `dartiq check` (M0 differential,
# engine-api-spec §4.1) and `dartiq analyze` (M1 engine); ship the binary
# under the tool name rather than the package name.
[[bin]]
name = "dartiq"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
dartiq-diagnostics = { path = "../dartiq-diagnostics" }
dartiq-engine = { path = "../dartiq-engine" }
dartiq-language = { path = "../dartiq-language" }
dartiq-package = { path = "../dartiq-package" }
dartiq-parser = { path = "../dartiq-parser" }
dartiq-pub = { path = "../dartiq-pub" }
dartiq-scanner = { path = "../dartiq-scanner" }
dartiq-sdk = { path = "../dartiq-sdk" }
dartiq-source = { path = "../dartiq-source" }
serde_json = { workspace = true }

# The metrics hook reads peak RSS through getrusage (engine-api-spec §3);
# unix-only until a non-unix story exists.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
