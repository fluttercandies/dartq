[package]
name = "dartq-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Machine-readable JSON schemas for dartq's versioned output faces, plus a structural validator."
repository.workspace = true
readme = "README.md"
keywords = ["dart", "json-schema", "schema", "validation"]
categories = ["development-tools"]

[dependencies]
serde_json = { workspace = true }

# Alignment tests only: the published schemas must accept what the real
# producers emit. dartq-schema itself has zero dartq-* runtime dependencies.
[dev-dependencies]
dartq-ai = { workspace = true }

[lints]
workspace = true
