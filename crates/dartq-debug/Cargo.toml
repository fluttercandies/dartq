[package]
name = "dartq-debug"
description = "Dart VM Service Protocol client and AI-first debug session orchestration for dartq"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true

[dependencies]
# WriteEvent payloads arrive base64-encoded on the Stdout/Stderr streams —
# a commodity decoder, not something this crate hand-rolls.
base64.workspace = true
crossbeam-channel.workspace = true
# SIGTERM to a launched `flutter run` (its cleanup handler stops the
# app); `Child::kill` is SIGKILL-only and would orphan the app.
libc.workspace = true
parking_lot.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tungstenite.workspace = true

[lints]
workspace = true
