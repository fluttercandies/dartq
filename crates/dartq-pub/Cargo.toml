[package]
name = "dartq-pub"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Readers for pub's resolution artifacts (package_config.json, pubspec.yaml, pubspec.lock) plus workspace discovery and freshness rules."
repository.workspace = true
readme = "README.md"
keywords = ["dart", "pub"]

[dependencies]
dartq-language = { path = "../dartq-language" }
dartq-source = { path = "../dartq-source" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Directly pinning file mtimes; std cannot set them and the freshness rules
# are stated in terms of strict mtime ordering (equal counts as stale).
filetime = { workspace = true }

[lints]
workspace = true
