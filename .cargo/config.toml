# Host resource discipline (2026-10-09 memory incident: concurrent cargo
# invocations across agent lanes spiked host memory to ~80 GB and froze the
# machine). This caps concurrent rustc/linker jobs for EVERY cargo invocation
# in this workspace. Do not override with `cargo build -j N`.
[build]
jobs = 2
# sccache wraps rustc: compilation results are content-addressed and reused
# across lanes/sessions (cargo check metadata caching is the big win with 7
# parallel lanes). Incremental invocations pass through uncached; correctness
# is unaffected. Requires `sccache` on PATH (brew install sccache).
rustc-wrapper = "sccache"
# Incremental rustc invocations are not cacheable — the official Rust
# caching notes REQUIRE disabling incremental (docs/Rust.md:10 in the
# .third/sccache reference checkout), and the stats breakdown confirms
# incremental calls pass straight through. Disabling it makes every
# compilation content-addressed: the dominant workload here (seven
# parallel lanes re-running cargo check over mostly-unchanged crates)
# turns whole dependency graphs into cross-lane cache hits. Note bin/
# proc-macro crates still miss (link step is never cached, Rust.md:11);
# their lib deps remain cacheable.
incremental = false
