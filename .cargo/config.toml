# Host resource discipline (2026-10-09 memory incident: concurrent cargo
# invocations across agent lanes spiked host memory to ~80 GB and froze the
# machine). This caps concurrent rustc/linker jobs for EVERY cargo invocation
# in this workspace. Do not override with `cargo build -j N`.
[build]
jobs = 2
# Incremental compilation is disabled: the dominant workload here (many
# parallel lanes re-running cargo check over mostly-unchanged crates) stays
# memory- and disk-bounded, and content-addressed compilation reuse (when a
# wrapper like sccache is enabled locally via the RUSTC_WRAPPER environment
# variable) requires it. The workspace itself pins no wrapper: a fresh
# clone builds with the plain toolchain, no extra prerequisites.
incremental = false
