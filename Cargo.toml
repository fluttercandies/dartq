[workspace]
resolver = "3"
# Explicit member list: `crates/dartq-plugin-host` is a Dart package (no
# Cargo.toml) and cargo 1.96 errors on glob-matched directories without one.
members = [
    "crates/dartq-source",
    "crates/dartq-language",
    "crates/dartq-scanner",
    "crates/dartq-parser",
    "crates/dartq-ast",
    "crates/dartq-sdk",
    "crates/dartq-package",
    "crates/dartq-pub",
    "crates/dartq-resolution",
    "crates/dartq-semantic",
    "crates/dartq-types",
    "crates/dartq-flow",
    "crates/dartq-index",
    "crates/dartq-incremental",
    "crates/dartq-diagnostics",
    "crates/dartq-lints",
    "crates/dartq-snapshot",
    "crates/dartq-cache",
    "crates/dartq-plugin",
    "crates/dartq-engine",
    "crates/dartq-commands",
    "crates/dartq-daemon",
    "crates/dartq-ai",
    "crates/dartq-cli",
    "crates/dartq-schema",
    "tests/harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.96"

[workspace.dependencies]
# One version decision per external dependency, made once here; member
# crates consume them via `name = { workspace = true }`.
blake3 = "1"
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5"
filetime = "0.2"
hex = "0.4"
libc = "0.2"
memchr = "2"
rayon = "1"
rustc-hash = "2.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[workspace.lints.rust]
rust_2018_idioms = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
