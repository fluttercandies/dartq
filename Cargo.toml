[workspace]
resolver = "3"
# Explicit member list: `crates/dartq-plugin-host` is a Dart package (no
# Cargo.toml) and cargo 1.96 errors on glob-matched directories without one.
members = [
    "crates/dartq-source",
    "crates/dartq-language",
    "crates/dartq-scanner",
    "crates/dartq-parser",
    "crates/dartq-ast",
    "crates/dartq-sdk",
    "crates/dartq-package",
    "crates/dartq-pub",
    "crates/dartq-resolution",
    "crates/dartq-semantic",
    "crates/dartq-types",
    "crates/dartq-flow",
    "crates/dartq-index",
    "crates/dartq-diagnostics",
    "crates/dartq-lints",
    "crates/dartq-snapshot",
    "crates/dartq-plugin",
    "crates/dartq-engine",
    "crates/dartq-commands",
    "crates/dartq-daemon",
    "crates/dartq-ai",
    "crates/dartq-cli",
    "crates/dartq-debug",
    "crates/dartq-schema",
    "crates/dartq-session",
    "crates/dartq-test",
    "tests/harness",
    "tools/bench-corpus-gen",
    "tools/corpus-gen",
    "tools/sdk-faces-gen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.96"
repository = "https://github.com/fluttercandies/dartq"

[workspace.dependencies]
# One version decision per external dependency, made once here; member
# crates consume them via `name = { workspace = true }`.
base64 = "0.22"
blake3 = "1"
# The CLI binary's global allocator: segment-based, returns freed pages
# promptly (the 100k cold peak is fragmentation-bound under the system
# allocator).
mimalloc = { version = "=0.1.52", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5"
filetime = "0.2"
hex = "0.4"
libc = "0.2"
# The CLI/MCP output face's default encoding: LON, the compact canonical
# text encoding of the JSON data model (serde/serde_json aside, zero deps).
lon = "0.1"
memchr = "2"
memmap2 = "0.9"
# Locks on the engine's shared pools: poisoning does not exist in this
# dialect — a guard comes back from `lock`/`read`/`write` directly, so one
# panicking task cannot cascade into every later task's lock site.
parking_lot = "0.12"
rayon = "1"
rustc-hash = "2.1.3"
simdutf8 = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
# The VM Service Protocol is served over WebSocket; rustls-tls enables the
# `wss:` scheme (TLS without pulling in platform-native TLS stacks).
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }

# Internal crates: path plus version so member manifests consume them via
# `dartq-xxx = { workspace = true }` (cargo publish requires a version on
# every path dependency).
dartq-ai = { path = "crates/dartq-ai", version = "0.1.0" }
dartq-ast = { path = "crates/dartq-ast", version = "0.1.0" }
dartq-commands = { path = "crates/dartq-commands", version = "0.1.0" }
dartq-daemon = { path = "crates/dartq-daemon", version = "0.1.0" }
dartq-debug = { path = "crates/dartq-debug", version = "0.1.0" }
dartq-diagnostics = { path = "crates/dartq-diagnostics", version = "0.1.0" }
dartq-engine = { path = "crates/dartq-engine", version = "0.1.0" }
dartq-flow = { path = "crates/dartq-flow", version = "0.1.0" }
dartq-index = { path = "crates/dartq-index", version = "0.1.0" }
dartq-language = { path = "crates/dartq-language", version = "0.1.0" }
dartq-lints = { path = "crates/dartq-lints", version = "0.1.0" }
dartq-package = { path = "crates/dartq-package", version = "0.1.0" }
dartq-parser = { path = "crates/dartq-parser", version = "0.1.0" }
dartq-plugin = { path = "crates/dartq-plugin", version = "0.1.0" }
dartq-pub = { path = "crates/dartq-pub", version = "0.1.0" }
dartq-resolution = { path = "crates/dartq-resolution", version = "0.1.0" }
dartq-scanner = { path = "crates/dartq-scanner", version = "0.1.0" }
dartq-schema = { path = "crates/dartq-schema", version = "0.1.0" }
dartq-sdk = { path = "crates/dartq-sdk", version = "0.1.0" }
dartq-semantic = { path = "crates/dartq-semantic", version = "0.1.0" }
dartq-session = { path = "crates/dartq-session", version = "0.1.0" }
dartq-snapshot = { path = "crates/dartq-snapshot", version = "0.1.0" }
dartq-source = { path = "crates/dartq-source", version = "0.1.0" }
dartq-test = { path = "crates/dartq-test", version = "0.1.0" }
dartq-types = { path = "crates/dartq-types", version = "0.1.0" }
notify = "6.1.1"
tempfile = "3"

[workspace.lints.rust]
rust_2018_idioms = "warn"

[workspace.lints.clippy]
# Groups sit at priority -1 so specific lints (priority 0) always win the
# tie — clippy's `lint_groups_priority` rejects a bare group at implicit 0
# tying with a named lint in the same table.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Hot-path hashing policy (see clippy.toml for the ban list): std hash
# collections are banned workspace-wide; use rustc-hash's FxHashMap/FxHashSet.
disallowed-types = "deny"
