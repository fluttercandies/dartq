[package]
name = "harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Internal differential-testing harness, not published to crates.io.
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rustc-hash = { workspace = true }

# plugin-overhead: the bench drives a live plugin through the runtime's
# feed/drain faces; the batch is synthesized in the engine's diagnostic model.
dartq-diagnostics = { workspace = true }
dartq-plugin = { workspace = true }
dartq-source = { workspace = true }

# POSIX process-group kill for timed-out drivers (see oracle.rs kill_driver).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
