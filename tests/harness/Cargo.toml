[package]
name = "harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rustc-hash = { workspace = true }

# plugin-overhead: the bench drives a live plugin through the runtime's
# feed/drain faces; the batch is synthesized in the engine's diagnostic model.
dartq-diagnostics = { path = "../../crates/dartq-diagnostics" }
dartq-plugin = { path = "../../crates/dartq-plugin" }
dartq-source = { path = "../../crates/dartq-source" }

# POSIX process-group kill for timed-out drivers (see oracle.rs kill_driver).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
