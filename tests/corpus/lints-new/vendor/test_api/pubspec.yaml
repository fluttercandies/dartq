name: test_api
version: 0.7.0
description: >-
  Minimal vendored package:test_api for the lints-new differential corpus
  (#1160), shaped exactly as the upstream use_test_throws_matchers test
  builds it (upstream Dart SDK source,
  pkg/linter/test/rules/use_test_throws_matchers_test.dart setUp :22-39):
  lib/src/frontend/expect.dart declares `expect` and `Never fail`, and
  lib/test_api.dart re-exports it. The URI identity of the DECLARING library
  (package:test_api/src/frontend/expect.dart) is what the official rule
  checks, so this vendored layout reproduces the official resolution face.
environment:
  sdk: ^3.0.0
