name: lint_new_corpus
description: >-
  LINT-face differential corpus for the 19-name 2026-10 promotion wave
  (#1160): every lib/ fixture sits under this package's analysis_options.yaml
  ancestry, which enables EXACTLY the 19 new rule names and nothing else.
  Fixtures are transcribed from the upstream linter test corpora
  (upstream Dart SDK source, pkg/linter/test/rules/<rule>_test.dart).
  The root package deliberately declares NO `version:` field: that is the
  no-version control face for remove_deprecations_in_breaking_versions,
  whose registration bails without one (upstream rule source :36-48).
  The breaking/non-breaking version faces ride in sibling twin packages
  under packages/ (see README).
environment:
  # Constraint choice (documented deviation from the ticket's "^3.7-style"
  # suggestion): pub settles the languageVersion from the constraint's LOWER
  # bound, and this corpus is consumed through the harness run face whose
  # preflight requires the self languageVersion >= 3.13
  # (tests/harness/src/corpus.rs MIN_LANGUAGE_VERSION). A 3.7 pin would
  # settle 3.7, trip that preflight, and additionally close the
  # future_sync_value language gate (the oracle's rule source bails when the
  # library's effective language version < 3.10). 3.13 admits every gate:
  # enhanced_enums (2.17), dot shorthands (3.10), future_sync_value (3.10),
  # primary-constructors (3.13) — and `dart pub get` still succeeds against
  # the fvm default oracle (Dart 3.13.1).
  sdk: ^3.13.0

dependencies:
  # Vendored minimal package:meta (the @immutable/@literal annotations the
  # upstream prefer_const_* corpora mount via addMetaPackageDep). Path-only,
  # offline; resolved identically by both differential legs through the
  # hand-materialized .dart_tool/package_config.json.
  meta:
    path: vendor/meta
  # Vendored minimal package:test_api shaped exactly as the upstream
  # use_test_throws_matchers test builds it (lib/src/frontend/expect.dart
  # declaring `fail`, re-exported by lib/test_api.dart): the official rule
  # resolves the `fail` element to the DECLARING library URI
  # package:test_api/src/frontend/expect.dart, which this vendored layout
  # reproduces byte-for-byte at the URI level.
  test_api:
    path: vendor/test_api
