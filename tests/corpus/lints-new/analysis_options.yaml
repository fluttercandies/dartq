# The 19-name differential face (#1160). Deliberately NO include chain:
# unlike tests/corpus/lints this corpus judges ONLY the new promotion wave,
# so the options file names exactly the 19 rules and nothing else. The
# analyzer's stock (non-lint) diagnostics fire regardless and are dropped by
# the differential's INFO x LINT filter. A nested twin package without its
# own analysis_options.yaml inherits this file by upward discovery, so the
# packages/ twins run the same nominal rule set on both legs.
analyzer:
  enable-experiment:
    # unnecessary_this_alias's two anonymous-method faces (`self.{ ... }`,
    # `self?.{ ... }`) parse only with the experiment — the same face the
    # upstream test mounts via experimentalFeatures. Options-level
    # experiments apply to every library of this package; the
    # disabled-experiment control (upstream
    # test_noDiagnostic_experimentDisabled) is therefore unmountable and is
    # skipped in that fixture's inventory.
    - anonymous_methods
linter:
  rules:
    # W5 slice (#1106/#1150 family landing; docs + flow).
    comment_references: true
    unnecessary_ignore: true
    deprecated_member_use_from_same_package: true
    remove_deprecations_in_breaking_versions: true
    use_test_throws_matchers: true
    # #1150 quintet (types x3 + names + collections).
    cancel_subscriptions: true
    close_sinks: true
    tighten_type_of_initializing_formals: true
    matching_super_parameters: true
    prefer_const_literals_to_create_immutables: true
    # #1151 sextet (expressions).
    prefer_const_constructors: true
    use_named_constants: true
    avoid_redundant_argument_values: true
    avoid_slow_async_io: true
    future_sync_value: true
    unnecessary_this_alias: true
    # #1152 trio (declarations).
    prefer_const_declarations: true
    prefer_mixin: true
    use_enums: true
