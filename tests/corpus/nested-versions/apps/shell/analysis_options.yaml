# Member-level options override for the shell subtree: nested files do
# not implicitly inherit the parent's rules (the official locator builds
# the effective set from THIS file's include chain), so the root set is
# included explicitly and the toggles apply relative to it. Strictness
# moves in both directions versus the root set:
#   - always_declare_return_types (on at the root) is silenced here;
#   - prefer_final_locals (off everywhere else in the corpus) is enabled
#     only for this subtree.
include: ../../analysis_options.yaml

linter:
  rules:
    always_declare_return_types: false
    prefer_final_locals: true
