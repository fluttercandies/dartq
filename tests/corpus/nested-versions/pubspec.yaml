# Workspace root of the nested-versions differential corpus. Synthetic
# resolution: `.dart_tool/package_config.json` is hand-written in pub's
# output shape (the same idiom as the other corpora under tests/corpus/ —
# no `pub get` needed, the config file IS the resolution result).
#
# The `workspace:` list names member directories at three depths
# (apps/shell, packages/core, packages/nested/deep_ui). The key requires
# language version >= 3.5 (upstream pub source, lib/src/pubspec.dart:71
# and lib/src/language_version.dart:114), which this root's
# `sdk: ^3.7.0` satisfies.
name: monorepo
description: Workspace root of the nested mixed-language-version corpus.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.7.0

workspace:
  - apps/shell
  - packages/core
  - packages/nested/deep_ui

dependencies:
  # Workspace members are declared with plain version constraints: pub
  # canonicalizes a dependency on any member to a dependency on the
  # workspace root (upstream pub source,
  # lib/src/solver/partial_solution.dart:20-21).
  core: ^1.0.0
  shell: ^1.0.0
  # Vendored path dependencies OUTSIDE workspace membership: their
  # settled language versions (3.0 and 2.19) are below the >= 3.5 gate,
  # so their pubspecs cannot legally declare `resolution: workspace` —
  # they ride along in the shared package_config as ordinary path deps.
  ext_lib:
    path: third_party/ext_lib
  legacy_lib:
    path: third_party/legacy/legacy_lib
