# The nested-options subtree inside the root package (design doc section
# 5 item 18). A nested options file without its own package config does
# NOT create a new oracle context root — it joins the root context's
# per-folder options map (context_locator.dart optionsFileMap), and dartq
# registers it at its directory during locate_nested (the #595
# nested-replace pin). The effective set is built from THIS file's include
# chain either way — nested files do not inherit the parent's rules
# implicitly, so the parent is included explicitly.
#
# Toggles relative to the parent's set:
#  - await_only_futures is silenced ONLY via this subtree set: the root
#    control lib/await_only_futures.dart fires, lib/sub/sub_silence.dart is
#    expect-empty (paired control design, same as the ignore-face files).
#  - prefer_single_quotes (a real SDK lint outside the package:lints sets)
#    is enabled ONLY via
#    this subtree set: the oracle runs it on lib/sub/sub_quotes.dart;
#    dartq has no implementation and reports undefined_lint on this
#    options file instead — both rows sit outside the frozen universe
#    codes file.
include: ../analysis_options.yaml

linter:
  rules:
    await_only_futures: false
    prefer_single_quotes: true
