# Plugin-parity corpus for clean_architecture_linter
# (scripts/plugin-parity.sh): the official face and the dartq face analyze
# this same tree with this same options file. Exactly one vendored plugin is
# declared, through the native `path:` source form the official server
# resolves into its synthetic plugin package; the diagnostics entries pin
# the corpus rules on (`true` = enable at the declared severity) identically
# on both faces. The `dependency_overrides` sibling pins the synthetic
# package's framework deps to the vendored copies so its pub solve is local.
# Every `path:` value here is relative to THIS file's directory: upstream
# options parsing absolutizes relative paths before they reach the generated
# plugin_entrypoint pubspec (upstream Dart SDK source,
# pkg/analyzer/lib/src/analysis_options/analysis_options_parse_model.dart
# `_parsePluginSource`), so the synthetic package's own location under
# .plugin_manager/ never enters resolution.
# lib/ keeps the feature-path layout the layer rules key on (byte-identical
# to ../../corpora/clean_architecture_linter).
linter:
  rules: []

plugins:
  clean_architecture_linter:
    path: ../../vendor/clean_architecture_linter-2.8.0
    diagnostics:
      repository_interface: true
      usecase_no_result_return: true
      repository_pass_through: true
      model_field_duplication: true
  dependency_overrides:
    analysis_server_plugin:
      path: ../../vendor/deps/analysis_server_plugin-0.3.25-dev
    analyzer:
      path: ../../vendor/deps/analyzer-14.5.0
    analyzer_plugin:
      path: ../../vendor/deps/analyzer_plugin-0.14.18
