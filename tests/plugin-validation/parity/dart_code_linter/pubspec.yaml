name: dartq_parity_dart_code_linter
description: >-
  Plugin-parity corpus package for dart_code_linter. The official face reads
  only analysis_options.yaml (its synthetic plugin package lives under the
  run's ANALYZER_STATE_LOCATION_OVERRIDE); this pubspec exists for the dartq
  face, whose plugin discovery resolves the declared plugin name through the
  package_config the override below produces (the preset technique,
  tests/plugin-validation/README.md).
publish_to: none

environment:
  sdk: ^3.13.0

dependency_overrides:
  dart_code_linter:
    path: ../../vendor/dart_code_linter-4.4.2
