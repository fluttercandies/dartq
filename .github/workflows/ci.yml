# Minimal release-grade CI.
#
# scripts/ci.sh (per-crate serial fmt + clippy) is fully subsumed by the
# workspace-wide steps of the `rust` job, so it is not re-run here. The
# `gates` job runs the M4 schema-freeze sweep + plugin-host Dart suite
# (#945), which scripts/ci.sh deliberately excludes, reproducing their
# local oracle assumptions on the runner:
#   - The sweep resolves the oracle at $FVM_HOME/default/bin/cache/dart-sdk
#     (fvm layout, default FVM_HOME=~/fvm); setup-dart's SDK is symlinked
#     into that shape.
#   - The oracle is pinned (3.13.1, the historical oracle of record)
#     instead of tracking stable.
#   - The sweep's default command expects ./target/{release,debug}/dartq;
#     both profiles are built.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Untracked-reference gate
        run: bash scripts/untracked-ref-gate.sh
      - name: Strip host-discipline cargo config (sccache wrapper + jobs=2)
        run: |
          sed -i '/^rustc-wrapper/d;/^jobs = 2/d' .cargo/config.toml
          if grep -qE '^(rustc-wrapper|jobs = 2)' .cargo/config.toml; then
            echo "::error::cargo config strip left matches behind (layout drift?)"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true # goal #133; flip at the terminal sweep
      # Covers every crate's unit + integration suites, including the M4
      # surfaces (#945: daemon/plugin/commands/schema). The dart-gated
      # plugin fixture tests self-skip here (no dart on this job) and the
      # #[ignore]d live faces stay opt-in (the DARTQ_M4_LIVE discipline).
      - run: cargo test --workspace

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip host-discipline cargo config (sccache wrapper + jobs=2)
        run: |
          sed -i '/^rustc-wrapper/d;/^jobs = 2/d' .cargo/config.toml
          if grep -qE '^(rustc-wrapper|jobs = 2)' .cargo/config.toml; then
            echo "::error::cargo config strip left matches behind (layout drift?)"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.1
      - name: Lay out the fvm-style oracle home
        run: |
          sdk_root="$(dirname "$(dirname "$(command -v dart)")")"
          mkdir -p "$HOME/fvm/default/bin/cache"
          ln -s "$sdk_root" "$HOME/fvm/default/bin/cache/dart-sdk"
      - name: Build dartq
        run: |
          cargo build -p dartq-cli --release
          cargo build -p dartq-cli
      # M4 schema-freeze sweep (#945): the frozen v1 CLI/RPC surface
      # end-to-end — CLI machine/json faces plus a live daemon RPC session
      # over a tiny fixture. Uses the debug dartq built above (--no-build)
      # and the sweep's fvm-layout SDK default.
      - name: Schema-freeze sweep
        run: bash scripts/schema-freeze-sweep.sh --no-build --label ci
      # M4 host suite (#945): the dartq_plugin_host package's own `dart
      # test` suite — pure in-process tests (no plugin process spawning),
      # so it is CI-safe by default. The Rust live faces (daemon-live /
      # plugin-live / compat-live) spawn real dart processes and stay
      # opt-in via DARTQ_M4_LIVE — deliberately not enabled on CI.
      - name: Plugin-host Dart suite
        working-directory: crates/dartq-plugin-host
        run: |
          dart pub get
          dart test -j 2
