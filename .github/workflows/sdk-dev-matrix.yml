# Dev-band multi-SDK differential matrix (the pre-release oracle face).
#
# Pinned dev builds from scripts/sdk-versions.txt (kept in lockstep with
# that snapshot): dev pins advance only green or by explicit bump — the dev
# channel yanks regressed builds, so auto-tracking the tip would 404. One
# job per pin, same gate caliber as the stable matrix (harness run over
# m0 + m0-syntax, ERROR severity, threshold 1.0) via sdk-matrix.sh's
# --dart-override single-SDK pass.
#
# Dev SDKs are >= 3.13, so they satisfy the corpora's own `sdk: ^3.13.0`
# pin and one SDK per job suffices (pub get, then oracle = that dart).
# This workflow is separate from the stable matrix by design: a dev
# regression never blocks (or is masked by) the stable band.
name: sdk-dev-matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * *" # daily, offset from the stable matrix and bench runs

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Pin snapshot: scripts/sdk-versions.txt (dev segment). Update both
        # together, green-or-deliberate-bump only.
        include:
          - version: 3.14.0-296.0.dev
    env:
      VERSION: ${{ matrix.version }}
      HARNESS: ./target/release/harness
      DARTQ_CMD: ./target/release/dartq check --format=machine
      GATE_OUT: target/evidence/sdk-matrix/override
    steps:
      - uses: actions/checkout@v4
      - name: Strip host-discipline cargo config (sccache wrapper + jobs=2)
        run: sed -i '/^rustc-wrapper/d;/^jobs = 2/d' .cargo/config.toml
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Install the pinned dev SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.version }}
      - name: Record the oracle dart path
        run: echo "ORACLE_DART=$(command -v dart)" >> "$GITHUB_ENV"
      - name: Pub-get the gate corpora
        run: |
          for corpus in m0 m0-syntax; do
            (cd "tests/corpus/$corpus" && dart pub get)
          done
      - name: Build dartq and harness (release)
        run: |
          cargo build -p dartq-cli --release
          cargo build -p harness --release
      - id: gate
        name: Differential gate (oracle dart ${{ matrix.version }})
        run: bash scripts/sdk-matrix.sh --dart-override "$ORACLE_DART"
      - name: Extract per-version metrics
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$GATE_OUT"
          report="$GATE_OUT/report.json"
          if [ -f "$report" ]; then
            jq -n --slurpfile r "$report" --arg v "$VERSION" '
              $r[0] as $r |
              {version: $v,
               oracle: ($r.meta.oracle_version
                        | capture("^Dart SDK version: (?<v>[^ ]+)") | .v),
               jaccard: $r.error_jaccard,
               verdict: (if $r.passed == true then "PASS"
                         elif $r.passed == false then "FAIL"
                         else "SKIPPED" end),
               oracle_total: $r.oracle_total,
               dartq_total: $r.dartq_total}' > "$GATE_OUT/metrics.json"
          else
            jq -n --arg v "$VERSION" \
              '{version: $v, oracle: null, jaccard: null, verdict: "ERROR",
                oracle_total: null, dartq_total: null}' > "$GATE_OUT/metrics.json"
          fi
          cat "$GATE_OUT/metrics.json"
      - name: Upload the per-version report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dev-matrix-${{ matrix.version }}
          path: target/evidence/sdk-matrix/override/
          if-no-files-found: warn

  summary:
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-dev-matrix-*
          path: artifacts
      - name: Aggregate the dev matrix summary
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import glob, json

          rows = []
          for path in sorted(glob.glob("artifacts/*/metrics.json")):
              with open(path) as f:
                  rows.append(json.load(f))

          lines = [
              "## SDK dev matrix (differential gate, threshold 1.0)",
              "",
              "| dart SDK | oracle | jaccard | verdict | oracle entries | dartq entries |",
              "| --- | --- | --- | --- | --- | --- |",
          ]
          bad = 0
          for r in rows:
              verdict = r.get("verdict", "ERROR")
              if verdict != "PASS":
                  bad += 1
              jac = r.get("jaccard")
              jac = "%.3f" % jac if isinstance(jac, (int, float)) else "-"

              def col(value):
                  return "-" if value is None else str(value)

              lines.append(
                  "| %s | %s | %s | %s | %s | %s |"
                  % (r.get("version", "?"), r.get("oracle") or "-", jac,
                     verdict, col(r.get("oracle_total")), col(r.get("dartq_total")))
              )
          lines.append("")
          lines.append("%d version(s), %d below the gate or errored." % (len(rows), bad))
          print("\n".join(lines))
          EOF
