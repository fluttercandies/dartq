# Nightly four-axis benchmark vs the oracle (the §19.3 metric face).
#
# Base oracle: the newest stable Dart (resolved live from the dart-archive
# VERSION pointer). Runs the harness's four comparison axes over the m0
# corpus with the prebuilt release binaries — rss-100k, incremental-p95
# (edit-manifest steps, --with-oracle captures the per-step `dart analyze`
# wall time), token-cost, cold — then renders a dartq-vs-oracle comparison
# table (per-axis multiple) into the Step Summary and a bench-report.md
# artifact, alongside the full per-metric JSON reports.
#
# m0 scale is the release-runbook smoke caliber: the cold row carries the
# harness's own methodology note (single run per side, process-boot
# dominated at small corpora) — cite only large-corpus ratios as milestone
# evidence; the nightly run is the trend line, not the milestone number.
name: bench

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *" # daily, offset from the two matrix runs

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BENCH_OUT: target/evidence/bench-ci
    steps:
      - uses: actions/checkout@v4
      - name: Strip host-discipline cargo config (sccache wrapper + jobs=2)
        run: |
          sed -i '/^rustc-wrapper/d;/^jobs = 2/d' .cargo/config.toml
          if grep -qE '^(rustc-wrapper|jobs = 2)' .cargo/config.toml; then
            echo "::error::cargo config strip left matches behind (layout drift?)"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Resolve the newest stable SDK
        # pipefail + the empty check: a resolver failure must fail here with
        # the script's stderr reason, not surface later as an opaque
        # setup-dart 404 on an empty version string.
        run: |
          set -euo pipefail
          version="$(bash scripts/sdk-matrix-versions.sh --stable-tip | cut -d'|' -f1)"
          if [ -z "$version" ]; then
            echo "::error::stable-tip resolver returned an empty version"
            exit 1
          fi
          echo "stable tip: $version"
          echo "STABLE_TIP=$version" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.STABLE_TIP }}
      - name: Record the oracle dart path
        run: echo "ORACLE_DART=$(command -v dart)" >> "$GITHUB_ENV"
      - name: Pub-get the bench corpus
        run: (cd tests/corpus/m0 && dart pub get)
      - name: Build dartq and harness (release)
        run: |
          cargo build -p dartq-cli --release
          cargo build -p harness --release
      - name: Write the incremental edit manifest
        run: |
          mkdir -p "$BENCH_OUT"
          # Five whole-file writes to one additive probe file: m0 files are
          # self-contained (no cross-file references), so a new file edits
          # nothing else and each step grows the analyzed surface.
          cat > "$BENCH_OUT/edit-manifest.json" <<'EOF'
          {
            "steps": [
              {"edits": [{"path": "lib/bench_probe.dart", "content": "void main() => print('bench probe step 1');\n"}]},
              {"edits": [{"path": "lib/bench_probe.dart", "content": "class ScreenA {\n  final String id;\n  const ScreenA(this.id);\n}\n\nvoid main() => print(ScreenA('a').id);\n"}]},
              {"edits": [{"path": "lib/bench_probe.dart", "content": "class ScreenA {\n  final String id;\n  const ScreenA(this.id);\n}\n\nclass ScreenB {\n  final ScreenA inner;\n  const ScreenB(this.inner);\n}\n\nvoid main() => print(ScreenB(ScreenA('b')).inner.id);\n"}]},
              {"edits": [{"path": "lib/bench_probe.dart", "content": "sealed class Node {}\n\nclass Leaf extends Node {\n  final int value;\n  Leaf(this.value);\n}\n\nString describe(Node node) => switch (node) {\n      Leaf(:final value) => 'leaf $value',\n    };\n\nvoid main() => describe(Leaf(1));\n"}]},
              {"edits": [{"path": "lib/bench_probe.dart", "content": "Future<void> run() async {\n  await for (final _ in Stream<int>.fromIterable(const [1, 2, 3])) {}\n}\n\nvoid main() => run();\n"}]}
            ]
          }
          EOF
      - id: bench
        name: Four-axis bench (dartq vs oracle)
        run: |
          ./target/release/harness bench \
            --corpus-dir tests/corpus/m0 \
            --manifest "$BENCH_OUT/edit-manifest.json" \
            --metric rss-100k --metric incremental-p95 --metric token-cost --metric cold \
            --dartq-cmd "./target/release/dartq check --format=machine" \
            --oracle-dart "$ORACLE_DART" \
            --with-oracle \
            --out "$BENCH_OUT"
      - name: Render the comparison report
        if: always()
        run: |
          set -o pipefail
          python3 - "$BENCH_OUT" <<'EOF' | tee "$BENCH_OUT/bench-report.md"
          import glob, json, os, statistics, sys

          out = sys.argv[1]

          def load(metric):
              path = os.path.join(out, metric, "report.json")
              if not os.path.isfile(path):
                  return None
              with open(path) as f:
                  return json.load(f)

          def num(value, unit="", digits=1):
              if not isinstance(value, (int, float)):
                  return "-"
              return "%.*f%s" % (digits, value, unit)

          rows = []
          notes = []

          rss = load("rss-100k")
          if rss:
              rows.append(("rss-100k (RSS/100k LOC)",
                           "%s KiB (peak %s KiB)" % (num(rss["rss_per_100k_loc_kib"], "", 2),
                                                     num(rss["peak_rss_kib"], "", 0)),
                           "n/a (oracle RSS not measured)", "-",
                           "%d files, %d LOC" % (rss["file_count"], rss["loc"])))

          inc = load("incremental-p95")
          if inc:
              oracle_ms = [s["oracle_duration_ms"] for s in inc["steps"]
                           if s.get("oracle_duration_ms") is not None]
              oracle_med = statistics.median(oracle_ms) if oracle_ms else None
              ratio = (oracle_med / inc["p95_ms"]) if oracle_med and inc["p95_ms"] else None
              rows.append(("incremental-p95 (edit step, batch driver)",
                           num(inc["p95_ms"], " ms"),
                           "median %s" % num(oracle_med, " ms"),
                           num(ratio, "x", 2) + (" (oracle median / dartq p95)" if ratio else ""),
                           "baseline %s ms, %d steps" % (num(inc["baseline_duration_ms"], "", 0),
                                                         len(inc["steps"]))))

          tok = load("token-cost")
          if tok:
              rows.append(("token-cost (machine output)",
                           num(tok["dartq_tokens"], " tokens", 0),
                           num(tok["oracle_tokens"], " tokens", 0),
                           num(tok.get("savings_ratio"), "", 3) + " savings",
                           "tokenizer %s" % tok["meta"]["tokenizer"]))

          cold = load("cold")
          if cold:
              rows.append(("cold full analysis",
                           num(cold["dartq_elapsed_ms"], " ms"),
                           num(cold["oracle_elapsed_ms"], " ms"),
                           num(cold["cold_ratio"], "x", 2) + " (oracle / dartq)",
                           "single run per side"))

          for metric in ["rss-100k", "incremental-p95", "token-cost", "cold"]:
              if load(metric) is None:
                  rows.append((metric, "ERROR (report missing)", "-", "-", "-"))

          lines = [
              "## Bench: dartq vs dart %s (m0 smoke scale)" % os.environ.get("STABLE_TIP", "stable"),
              "",
              "| axis | dartq | oracle | ratio | note |",
              "| --- | --- | --- | --- | --- |",
          ]
          for row in rows:
              lines.append("| %s |" % " | ".join(row))
          lines.append("")
          if cold:
              lines.append("Cold caveat: %s" % cold["note"])
          print("\n".join(lines))
          EOF
      - name: Append the report to the step summary
        if: always()
        run: cat "$BENCH_OUT/bench-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the bench report and metric JSONs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: ${{ env.BENCH_OUT }}/
          if-no-files-found: warn
